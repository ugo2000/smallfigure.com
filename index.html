<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="site.title">smallfigure · 原创素材图鉴</title>
<meta name="description" data-i18n-content="meta.desc" content="smallfigure 原创素材图鉴：角色立绘、武器装备、弹药军械、徽章、动物、食物美食、载具机械、异星生物、异星植物、石器原始、奇色液体、魔法书籍、魔法法器、城堡建筑、古旧家具、奇械科技、异星猎食、星球徽志……每件素材都有自己的故事，不限题材。支持分类、尺寸筛选与名称搜索。">
<link rel="icon" type="image/webp" href="assets/img/thumbs/hero_t.webp">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="4.5" fill="currentColor"/></svg>
      </span>
      <div class="brand-text">
        <h1>smallfigure</h1>
        <p class="subtitle" data-i18n="hero.subtitle">万物皆有自己的故事，smallfigure 收集这些故事</p>
      </div>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" data-i18n-ph="search.placeholder" placeholder="搜素材 / 标签：角色、武器、弹药、动物、食物、载具、异星生物、异星植物、石器、液体、法典、法器、城堡、家具、科技、猎食、星球、透明、徽章…" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="lang-toggle" id="langToggle" role="group" data-i18n-aria="lang.label" aria-label="语言">
      <button class="lang-btn" type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-bg" role="img" data-i18n-aria="hero.bg.alt" aria-label="宣传画"></div>
  <div class="hero-scrim" aria-hidden="true"></div>
  <div class="wrap hero-inner">
    <p class="hero-kicker" data-i18n="hero.kicker">原创素材图鉴</p>
    <h2 class="hero-title" data-i18n="hero.title">万物皆有自己的故事</h2>
    <p class="hero-sub" data-i18n="hero.sub">smallfigure 收集这些故事：97 件原创小人、小徽章和奇异物件，按分类浏览，大图免费下载</p>
    <div class="hero-pills">
      <span data-i18n="hero.pill.count">97 件素材</span>
      <span data-i18n="hero.pill.cats">18 个分类</span>
      <span data-i18n="hero.pill.free">大图免费下载</span>
    </div>
    <a class="hero-cta btn primary" href="#grid"><span data-i18n="hero.cta">开始浏览</span><i class="hero-arrow" aria-hidden="true">↓</i></a>
  </div>
</section>

<nav class="toolbar" id="toolbar">
  <div class="wrap toolbar-inner">
    <div class="chips" id="chips" role="tablist" data-i18n-aria="toolbar.cats" aria-label="分类筛选"></div>
    <div class="filters">
      <label class="sel">
        <span data-i18n="filter.size">尺寸</span>
        <select id="sizeFilter">
          <option value="all" data-i18n="size.all">全部尺寸</option>
          <option value="s" data-i18n="size.s">≤ 400 px</option>
          <option value="m" data-i18n="size.m">401 – 800 px</option>
          <option value="l" data-i18n="size.l">801 – 1600 px</option>
          <option value="xl" data-i18n="size.xl">&gt; 1600 px</option>
        </select>
      </label>
      <label class="sel">
        <span data-i18n="filter.sort">排序</span>
        <select id="sortBy">
          <option value="default" data-i18n="sort.default">默认</option>
          <option value="size-desc" data-i18n="sort.size-desc">尺寸从大到小</option>
          <option value="bytes-desc" data-i18n="sort.bytes-desc">体积从大到小</option>
          <option value="name" data-i18n="sort.name">名称</option>
        </select>
      </label>
    </div>
  </div>
</nav>

<main class="wrap">
  <p class="count-line" id="countLine"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <div class="empty-icon">🔍</div>
    <p data-i18n="empty.title">没有匹配的图片</p>
    <button class="btn ghost" id="resetBtn" data-i18n="empty.reset">清空筛选条件</button>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="dim"><span data-i18n="footer.contact">联系：</span><a href="mailto:ugo2000@126.com">ugo2000@126.com</a></p>
    <p class="dim" data-i18n="footer.hosted">© 2026 smallfigure.com</p>
  </div>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-mask" data-close></div>
  <div class="lb-panel" role="dialog" aria-modal="true">
    <button class="lb-close" data-close data-i18n-aria="lb.close" aria-label="关闭">×</button>
    <div class="lb-stage" id="lbStage"></div>
    <aside class="lb-info">
      <p class="lb-cat" id="lbCat"></p>
      <h2 id="lbName"></h2>
      <p class="lb-desc" id="lbDesc"></p>
      <dl class="lb-meta" id="lbMeta"></dl>
      <div class="lb-tags" id="lbTags"></div>
      <div class="lb-actions">
        <a class="btn primary" id="lbDownload" download data-i18n="lb.download">下载大图</a>
        <button class="btn ghost" id="lbPlay" hidden data-i18n="lb.pause">暂停</button>
        <div class="lang-toggle lang-toggle-sm" role="group" data-i18n-aria="lang.label" aria-label="语言">
          <button class="lang-btn" type="button" data-lang="zh" aria-pressed="true">中文</button>
          <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <div class="lb-nav">
        <button class="btn ghost" id="lbPrev" data-i18n="lb.prev">‹ 上一张</button>
        <span id="lbPos"></span>
        <button class="btn ghost" id="lbNext" data-i18n="lb.next">下一张 ›</button>
      </div>
    </aside>
  </div>
</div>

<audio id="bgm" src="assets/audio/bgm.mp3" loop preload="auto"></audio>
<button class="bgm-btn" id="bgmBtn" type="button" data-i18n-title="bgm.title" data-i18n-aria="bgm.aria" title="背景音乐" aria-label="背景音乐开关"></button>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
